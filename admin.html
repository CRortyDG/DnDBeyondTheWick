<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1013" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!-- The site owner's admin console. Harmless without the admin key: every number comes from /api/admin, which needs it. -->
    <title>Candlefair admin</title>
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the console's script never runs (a stale cached file, an old browser), say so instead of a blank page.
      setTimeout(function () {
        var r = document.getElementById("root");
        if (r && !r.childElementCount) r.innerHTML = '<p style="font:16px system-ui;color:#c9cdd3;padding:24px">The admin page didn\'t load. Try a hard refresh (Ctrl+Shift+R or Cmd+Shift+R).</p>';
      }, 4000);
    </script>
    <script type="module" src="/src/client/admin/main.tsx"></script>
  </body>
</html>
